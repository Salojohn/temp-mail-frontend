<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temporary Email GR</title>

  <style>
    :root { color-scheme:light dark }
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;max-width:980px;margin:0 auto;padding:24px}
    h1{font-size:28px;margin:0 0 16px}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    button{padding:8px 12px;border-radius:10px;border:1px solid #d1d5db;background:#f9fafb;cursor:pointer}
    button:hover{background:#eef2ff}
    .muted{color:#6b7280}
    .msg{white-space:pre-wrap}
    .error{color:#b91c1c}
    .pill{font-size:12px;border:1px solid #e5e7eb;border-radius:999px;padding:2px 8px}
    .list{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
    .live-item{display:flex;gap:8px;align-items:center}
    .live-time{font-size:12px}
    .live-subject{font-size:14px;font-weight:600}
  </style>
</head>
<body>

<h1>Temp Mail στην Ελλάδα — προσωρινό email με 1 κλικ</h1>

<div class="card">
  <div class="row">
    <button id="create">Δημιουργία διεύθυνσης</button>
    <div id="email" class="row pill"></div>
    <span id="ttl" class="muted"></span>
  </div>
  <div id="status" class="muted"></div>
</div>

<div class="grid">
  <!-- Live panel -->
  <div class="card" id="liveBox" aria-live="polite">
    <div class="muted" style="margin-bottom:6px">Ζωντανό Inbox • updates κάθε 3s</div>
    <ul id="live" class="list"><!-- γεμίζει αυτόματα --></ul>
  </div>

  <!-- Διαφημιστικό ή άλλο block προαιρετικά -->
  <div class="card">
    <div class="muted">Διαφήμιση / Ανακοίνωση</div>
    <div id="ad-placeholder" class="muted" style="font-size:12px">Χώρος για AdSense ή άλλο περιεχόμενο.</div>
  </div>
</div>

<div class="card">
  <h3>Inbox</h3>
  <div id="messages"></div>
</div>

<script>
  // ---------- API base URL ----------
  // Στο live domain (temp-mail.gr) μιλάμε στο api.temp-mail.gr.
  // Αλλιώς, (π.χ. σε dev), βάλε το Render URL του API σου:
  const API = location.hostname.endsWith('temp-mail.gr')
    ? 'https://api.temp-mail.gr'
    : 'https://temp-mail-api-2.onrender.com'; // <--- βάλε εδώ το dev URL σου αν χρειαστεί

  const $ = (s, e = document) => e.querySelector(s);
  let local = null, expiresAt = null, poller = null;

  const setStatus = (t, isErr = false) => {
    const el = $('#status');
    el.textContent = t || '';
    el.className = isErr ? 'error' : 'muted';
  };

  // Δημιουργία διεύθυνσης
  $('#create').onclick = async () => {
    try {
      setStatus('Δημιουργία διεύθυνσης…');
      const r = await fetch(`${API}/create`, { method: 'POST' });
      if (!r.ok) throw new Error(`Create failed (${r.status})`);
      const j = await r.json();

      local = j.local;
      expiresAt = Date.now() + (j.expires_in * 1000);

      $('#email').innerHTML =
        `<strong>${j.email}</strong> <button onclick="copyText('${j.email}')">Copy</button>`;

      tickTTL();
      if (poller) clearInterval(poller);
      poller = setInterval(loadInbox, 3000);
      await loadInbox();

      setStatus('Η διεύθυνση είναι έτοιμη.');
    } catch (e) {
      console.error(e);
      setStatus(`Error: ${e.message}`, true);
      alert(`API error (create): ${e.message}`);
    }
  };

  window.copyText = async (t) => {
    try { await navigator.clipboard.writeText(t); alert('Copied!'); }
    catch { /* ignore */ }
  };

  function tickTTL() {
    const int = setInterval(() => {
      if (!expiresAt) { clearInterval(int); return; }
      const left = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
      $('#ttl').textContent = left ? `λήγει σε ${left}s` : 'έληξε';
      if (left === 0) { clearInterval(int); if (poller) clearInterval(poller); }
    }, 1000);
  }

  // ---------- LIVE PANEL ----------
  const seenIds = new Set();
  function renderLive(newMsgs) {
    const live = $('#live');
    if (!live) return;
    for (const m of newMsgs) {
      if (seenIds.has(m.id)) continue;
      seenIds.add(m.id);

      const li = document.createElement('li');
      li.className = 'live-item';
      li.innerHTML = `
        <span class="live-time muted">${new Date(m.received_at).toLocaleTimeString()}</span>
        <span class="live-subject">${m.subject || '(no subject)'}</span>
        <span class="muted">— ${m.from || ''}</span>
      `;
      live.prepend(li);
      while (live.children.length > 6) live.removeChild(live.lastChild);
    }
  }

  // ---------- Κύριο Inbox ----------
  async function loadInbox() {
    if (!local) return;
    try {
      const r = await fetch(`${API}/inbox/${encodeURIComponent(local)}`);
      if (!r.ok) {
        $('#messages').innerHTML = '<div class="muted">Το inbox έληξε.</div>';
        clearInterval(poller);
        return;
      }
      const j = await r.json();
      const list = j.messages || [];

      // τροφοδότησε το live panel με τα πιο πρόσφατα (μέχρι 3)
      renderLive(list.slice(0, 3));

      const box = $('#messages'); box.innerHTML = '';
      for (const m of list) {
        const wrap = document.createElement('div');
        wrap.className = 'card';
        wrap.innerHTML = `
          <div><strong class="subject"></strong> <span class="muted from"></span></div>
          <div class="muted time"></div>
          <div class="msg preview"></div>
          <details>
            <summary>Άνοιγμα πλήρους μηνύματος</summary>
            <iframe class="html" sandbox="allow-same-origin"
                    style="width:100%;height:300px;border:1px solid #e5e7eb;border-radius:8px"></iframe>
            <pre class="plain"></pre>
          </details>
        `;
        wrap.querySelector('.subject').textContent = m.subject || '(no subject)';
        wrap.querySelector('.from').textContent = ' — ' + (m.from || '');
        wrap.querySelector('.time').textContent = new Date(m.received_at).toLocaleString();
        wrap.querySelector('.preview').textContent = m.preview || '';

        wrap.querySelector('details').addEventListener('toggle', async ev => {
          if (!ev.target.open) return;
          try {
            const rr = await fetch(`${API}/message/${encodeURIComponent(m.id)}`);
            const full = await rr.json();
            const iframe = wrap.querySelector('.html');
            if (full.body_html) {
              const blob = new Blob([full.body_html], { type: 'text/html' });
              iframe.src = URL.createObjectURL(blob);
            }
            wrap.querySelector('.plain').textContent = full.body_plain || '';
          } catch (e) {
            console.error(e);
            alert('Αποτυχία φόρτωσης πλήρους μηνύματος.');
          }
        }, { once: true });

        box.appendChild(wrap);
      }
      if (list.length === 0) box.innerHTML = '<div class="muted">Δεν υπάρχουν μηνύματα ακόμη…</div>';
    } catch (e) {
      console.error(e);
      setStatus(`Inbox error: ${e.message}`, true);
    }
  }
</script>
</body>
</html>
